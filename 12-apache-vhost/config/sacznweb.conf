# Estado histórico; para hardening véase ../VALIDACION.md.
<VirtualHost *:80>
    ServerName sacznweb.local
    ServerAdmin admin@sacznweb.local
    DocumentRoot /var/www/sacznweb

    ErrorLog ${APACHE_LOG_DIR}/sacznweb_error.log
    CustomLog ${APACHE_LOG_DIR}/sacznweb_access.log combined

    <Directory /var/www/sacznweb>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
