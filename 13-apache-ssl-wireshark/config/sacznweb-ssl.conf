# Propuesta para Ubuntu/Apache 2.4 + OpenSSL con TLS 1.3.
# No es una exportación de la VM original. Requiere mod_ssl y mod_headers.
<VirtualHost *:443>
    ServerName sacznweb.local
    DocumentRoot /var/www/sacznweb

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/sacznweb.crt
    SSLCertificateKeyFile /etc/apache2/ssl/sacznweb.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/sacznweb>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    ErrorLog ${APACHE_LOG_DIR}/sacznweb_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/sacznweb_ssl_access.log combined
</VirtualHost>
